<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suprime avisos esperados de WebSocket HMR desativado no ambiente AI Studio
      (function() {
        // Intercepta instanciação do WebSocket de HMR do Vite para evitar erro "WebSocket closed without opened"
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1));
            if (isHmr) {
              return {
                readyState: 1, // OPEN
                url: url,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                addEventListener: function(event, handler) {
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler({ type: 'open' }); } catch(e) {}
                    }, 50);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = String(arg && arg.message ? arg.message : arg);
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('@vite/client') !== -1) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        window.onerror = function(msg, url, line, col, error) {
          var str = String(msg || (error && error.message) || error || '');
          if (str.indexOf('WebSocket') !== -1 || String(url || '').indexOf('@vite/client') !== -1) {
            return true;
          }
        };

        window.addEventListener('error', function(e) {
          var msg = String(e.message || (e.error && e.error.message) || '');
          var file = String(e.filename || '');
          if (msg.indexOf('WebSocket') !== -1 || file.indexOf('@vite/client') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = String(e.reason && e.reason.message ? e.reason.message : e.reason || '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
    <title>Assistente de Gastos - Cartão Corporativo & Despesas</title>
