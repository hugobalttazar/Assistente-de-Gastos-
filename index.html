    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignora erros esperados de WebSocket HMR desativado no ambiente AI Studio
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
